<style>

:root{color-scheme:light;--ink:#172d2b;--muted:#526662;--teal:#006b5b;--line:#dce7e2;--paper:#f4f8f6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,"Malgun Gothic",sans-serif}
.wrap{width:min(1180px,calc(100% - 36px));margin:auto}header{background:linear-gradient(115deg,#103630,#085749);color:#fff;padding:48px 0 40px}
header h1{font-size:clamp(28px,5vw,48px);line-height:1.18;letter-spacing:-.05em;margin:0 0 12px}header p{margin:0 0 22px;color:#d7ebe3}
a{color:inherit}header .brand{display:inline-block;margin:0 0 12px;padding:4px 11px;border:1px solid #ffffff55;border-radius:100px;color:#d7f4e9;font-size:.82rem;font-weight:700;letter-spacing:.04em}
header .accent{color:#a8efca}header #intro{margin:0}
.hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 94% 0%,#218974 0%,transparent 54%),linear-gradient(115deg,#103630,#085749)}
.hero::after{content:"";position:absolute;right:max(6vw,20px);top:-110px;width:330px;height:330px;border:1px solid #ffffff22;border-radius:50%;box-shadow:0 0 0 26px #ffffff0b,0 0 0 58px #ffffff0b;pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.controls{position:sticky;top:0;z-index:2;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 0}
.controls .wrap{display:grid;gap:10px}nav{display:flex;gap:7px;overflow-x:auto;padding:3px 3px 7px;scrollbar-width:thin}
button,input{font:inherit}button{white-space:nowrap;border:1px solid var(--line);border-radius:100px;padding:7px 13px;background:#fff;color:var(--ink);cursor:pointer}
button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}button span{margin-left:6px;font-size:.8em}
input{width:min(100%,420px);padding:9px 14px;border:1px solid #a9bfb7;border-radius:10px;background:white;color:var(--ink)}
main{padding:22px 0 46px}#status{color:var(--muted);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:17px}
article{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.media{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#dfede4,#b9d8ce);font-size:44px}.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.body{padding:15px 16px;display:flex;flex:1;flex-direction:column;align-items:flex-start}
.tag{color:var(--teal);font-size:.8rem;font-weight:700}h2{font-size:1.1rem;line-height:1.4;margin:4px 0 10px;overflow-wrap:anywhere}
.note{background:#edf7ef;padding:7px 10px;border-radius:8px;font-size:.9rem;white-space:pre-wrap;margin:0 0 9px}.address{color:var(--muted);font-size:.84rem;margin:0 0 12px}.map{margin-top:auto;font-size:.9rem;font-weight:700;color:var(--teal);text-underline-offset:3px}
:focus-visible{outline:2px solid #ad4f00;outline-offset:2px}@media(max-width:540px){header{padding:29px 0 25px}.wrap{width:calc(100% - 28px)}}

.card-actions{display:flex;gap:8px;margin-top:10px;padding-top:8px;border-top:1px solid #edf3f0}
.card-gmap{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  background:#006b5b;color:#fff;text-decoration:none;
  font-size:.82rem;font-weight:700;padding:7px 10px;border-radius:8px
}
.card-gmap:hover{background:#085749}
.card-copy{
  border:1px solid var(--line);background:#f7fbf9;color:var(--muted);
  border-radius:8px;padding:7px 10px;font-size:.8rem
}
.card-copy:hover{color:var(--ink);border-color:#9fc0b4}

.header-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.header-top .brand{margin:0}
.master-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:#fff;color:#085749;text-decoration:none;
  font-weight:700;font-size:.88rem;padding:8px 14px;border-radius:100px;
  box-shadow:0 2px 8px rgba(0,0,0,.16);transition:transform .12s ease
}
.master-btn:hover{transform:translateY(-1px)}

</style>
</head>

<script>
const data = JSON.parse(document.getElementById('data').textContent);
const icons = {'한식':'🍚','베트남 음식':'🍜','해산물':'🍤','일식·중식':'🍣','양식':'🍔','기타 음식':'🍽️','카페·디저트':'☕','바·라운지':'🍸','스파·뷰티':'🌿','쇼핑·약국':'🛍️','골프·레저':'⛳','숙박·렌탈':'🧳','기타':'📍'};
const filters = document.getElementById('filters');
const search = document.getElementById('search');
const grid = document.getElementById('grid');
const statusEl = document.getElementById('status');
const buttons = new Map();
const counts = new Map();
let active = '전체';

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function card(place) {
  const art = el('article', 'card');
  const media = el('div', 'media', icons[place.category] || '📍');
  media.setAttribute('aria-hidden', 'true');
  if (place.photo) {
    const img = el('img');
    img.alt = '';
    img.loading = 'lazy';
    img.decoding = 'async';
    img.addEventListener('error', () => img.remove(), {once: true});
    img.src = place.photo;
    media.append(img);
  }
  const body = el('div', 'body');
  body.append(el('span', 'tag', place.category));

  const title = el('h2');
  const link = el('a', '', place.name);
  link.href = place.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  title.append(link);
  body.append(title);

  if (place.note) body.append(el('p', 'note', place.note));
  if (place.address) body.append(el('p', 'addr', place.address));

  const actions = el('div', 'card-actions');
  const gmap = el('a', 'card-gmap', '구글맵 열기 ↗');
  gmap.href = place.url;
  gmap.target = '_blank';
  gmap.rel = 'noopener noreferrer';
  gmap.setAttribute('aria-label', place.name + ' 구글맵에서 열기');

  const copyBtn = el('button', 'card-copy', '링크 복사');
  copyBtn.type = 'button';
  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(place.url);
      const prev = copyBtn.textContent;
      copyBtn.textContent = '복사됨 ✓';
      setTimeout(() => { copyBtn.textContent = prev; }, 1200);
    } catch (_) {}
  });

  actions.append(gmap, copyBtn);
  body.append(actions);
  art.append(media, body);
  return art;
}

function render() {
  const terms = search.value.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean);
  const matching = data.places.filter(place => {
    if (active !== '전체' && place.category !== active) return false;
    const hay = [place.name, place.note, place.address, place.category].join(' ').normalize('NFKC').toLowerCase();
    return terms.every(t => hay.includes(t));
  });
  statusEl.textContent = matching.length ? `${active} · ${matching.length}곳` : '조건에 맞는 업체가 없습니다.';
  grid.replaceChildren(...matching.map(card));
}

document.getElementById('intro').textContent = data.intro;
if (data.url) {
  document.getElementById('masterLink').href = data.url;
}
counts.set('전체', data.places.length);
for (const p of data.places) counts.set(p.category, (counts.get(p.category) || 0) + 1);
for (const cat of ['전체', ...Object.keys(icons)]) {
  if (!counts.has(cat)) continue;
  const btn = el('button', '', cat);
  btn.type = 'button';
  btn.setAttribute('aria-pressed', String(cat === active));
  btn.append(el('span', '', String(counts.get(cat))));
  btn.addEventListener('click', () => {
    buttons.get(active).setAttribute('aria-pressed', 'false');
    active = cat;
    btn.setAttribute('aria-pressed', 'true');
    render();
    if (window.scrollY > filters.offsetTop) window.scrollTo(0, 0);
  });
  buttons.set(cat, btn);
  filters.append(btn);
}
search.addEventListener('input', render);
render();
</script>
